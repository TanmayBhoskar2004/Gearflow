<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/mltjg0qg/image/upload/v1791351602/logo.png.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GearFlow — Vehicle Service Tracker</title>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #initial-loader img {
        width: 180px;
        height: auto;
        margin-bottom: 24px;
        animation: gearPulse 1.6s ease-in-out infinite;
      }

      #initial-loader .brand {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 20px;
      }

      #initial-loader .brand .gear { color: #ffffff; }
      #initial-loader .brand .flow { color: #00b8d4; }

      #initial-loader .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #00b8d4;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      #initial-loader .loading-text {
        margin-top: 16px;
        color: #90a4ae;
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes gearPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.92; }
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <img
        src="https://res.cloudinary.com/mltjg0qg/image/upload/v1791351602/logo.png.png"
        alt="GearFlow"
      />
      <div class="brand">
        <span class="gear">Gear</span><span class="flow">Flow</span>
      </div>
      <div class="spinner"></div>
      <div class="loading-text">Loading...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
